spring.application.name=pesapalpayment

# Server
server.port=9500

#Swagger: http://localhost:9500/swagger-ui/index.html
#Stripe : http://localhost:9500/card.html?secret=pi_************2ySH_secret_2************7

# Enable HTTPS
server.address=0.0.0.0
springdoc.api-docs.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Azure Deployment
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:************}:${MYSQL_PORT:************}/PesaPalPayment?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:************}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:************}

#jpa vendor adapter configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

spring.datasource.hikari.connection-test-query=SELECT 1

# Logging
logging.level.com.stripe=DEBUG
logging.level.org.springframework.web=DEBUG


# Pesapal Configuration
pesapal.consumer-key=*************
pesapal.consumer-secret=*************
pesapal.environment=test     # Change to "live" when ready
pesapal.callback-url=https://yourshop.co.ke/payment-success

# Pesapal IPN ID from successful registration
pesapal.ipn-id=*************

ngrok.app_url=https://*************.ngrok-free.app